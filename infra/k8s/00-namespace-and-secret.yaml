# ── Namespace and credentials ───────────────────────────────────────────────
# Ephemeral lab on a private network. The password is in clear here on purpose:
# nothing in this repository is a credential-management design. A cluster that
# is exposed needs Workload Identity or a secret manager, and this Secret should
# be replaced rather than edited.
apiVersion: v1
kind: Namespace
metadata:
  name: pgcache-mt
---
apiVersion: v1
kind: Secret
metadata:
  name: lab-db
  namespace: pgcache-mt
type: Opaque
stringData:
  POSTGRES_PASSWORD: benchpass
