apiVersion: v1
kind: Service
metadata:
  name: pgcache
spec:
  clusterIP: None
  selector:
    app: pgcache
  ports:
    - port: {{ .Values.pgcache.listenPort }}
      targetPort: {{ .Values.pgcache.listenPort }}
      name: sql
    - port: {{ .Values.pgcache.metricsPort }}
      targetPort: {{ .Values.pgcache.metricsPort }}
      name: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgcache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgcache
  template:
    metadata:
      labels:
        app: pgcache
        lab/role: pgcache
    spec:
      {{- if .Values.hostNetwork.enabled }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.affinity.enabled }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: lab/role
                    operator: In
                    values: [origin, loadgen]
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with (.Values.pgcache.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.pgcache.tolerations | default .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.netTune .Values.netTune.enabled }}
      initContainers:
        - name: tune-net-stack
          image: {{ .Values.netTune.image | default "busybox:1.36" | quote }}
          securityContext:
            privileged: true
          command:
            - /bin/sh
            - -c
            - |
              sysctl -w net.ipv4.tcp_slow_start_after_idle=0 || true
              sysctl -w net.core.somaxconn=65535 || true
              sysctl -w net.ipv4.tcp_max_syn_backlog=65535 || true
              sysctl -w net.ipv4.tcp_tw_reuse=1 || true
              for f in /sys/class/net/eth*/queues/rx-*/rps_cpus; do
                echo "f" > "$f" 2>/dev/null || true
              done
      {{- end }}
      containers:
        - name: pgcache
          image: "{{ .Values.image.pgcache.repository }}:{{ .Values.image.pgcache.tag }}"
          imagePullPolicy: {{ .Values.image.pgcache.pullPolicy }}
          env:
            - name: UPSTREAM_URL
              value: {{ .Values.pgcache.upstreamUrl | default (printf "postgres://%s:%s@origin.%s.svc.cluster.local:5432/%s" .Values.origin.user .Values.origin.password .Release.Namespace .Values.origin.database) | quote }}
            - name: LISTEN_PORT
              value: {{ .Values.pgcache.listenPort | quote }}
            - name: METRICS_PORT
              value: {{ .Values.pgcache.metricsPort | quote }}
            - name: NUM_WORKERS
              value: {{ .Values.pgcache.workers | quote }}
            - name: ALLOWED_TABLES
              value: {{ include "pgcache-mt.allowedTables" . | quote }}
            - name: PGCACHE_TELEMETRY
              value: {{ .Values.pgcache.telemetry | quote }}
            {{- if .Values.pgcache.memoCacheSize }}
            - name: MEMO_CACHE_SIZE
              value: {{ .Values.pgcache.memoCacheSize | quote }}
            {{- end }}
            {{- if .Values.pgcache.memoryLimit }}
            - name: MEMORY_LIMIT
              value: {{ .Values.pgcache.memoryLimit | quote }}
            {{- end }}
            {{- if .Values.pgcache.populationWorkersMin }}
            - name: PGCACHE_POPULATION_WORKERS_MIN
              value: {{ .Values.pgcache.populationWorkersMin | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.pgcache.listenPort }}
              name: sql
            - containerPort: {{ .Values.pgcache.metricsPort }}
              name: metrics
          resources:
            {{- toYaml .Values.pgcache.resources | nindent 12 }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
