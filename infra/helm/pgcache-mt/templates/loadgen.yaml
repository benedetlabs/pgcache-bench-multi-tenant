apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loadgen-results
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.loadgen.storage.storageClassName }}
  storageClassName: {{ .Values.loadgen.storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.loadgen.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
        lab/role: loadgen
    spec:
      {{- if .Values.hostNetwork.enabled }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.affinity.enabled }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: lab/role
                    operator: In
                    values: [origin, pgcache]
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: bench
          image: "{{ .Values.image.loadgen.repository }}:{{ .Values.image.loadgen.tag }}"
          imagePullPolicy: {{ .Values.image.loadgen.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - "pgbench --version && psql --version && exec sleep infinity"
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "command -v pgbench && command -v psql"
            initialDelaySeconds: 3
            periodSeconds: 5
          workingDir: /lab
          env:
            - name: ORIGIN_HOST
              value: "origin.{{ .Release.Namespace }}.svc.cluster.local"
            - name: ORIGIN_PORT
              value: "5432"
            - name: PGCACHE_HOST
              value: "pgcache.{{ .Release.Namespace }}.svc.cluster.local"
            - name: PGCACHE_PORT
              value: {{ .Values.pgcache.listenPort | quote }}
            - name: PGUSER
              value: {{ .Values.origin.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.origin.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-db
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.loadgen.resources | nindent 12 }}
          volumeMounts:
            - name: lab
              mountPath: /lab
      volumes:
        - name: lab
          persistentVolumeClaim:
            claimName: loadgen-results
