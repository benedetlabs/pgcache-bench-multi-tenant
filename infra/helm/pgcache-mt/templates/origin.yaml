apiVersion: v1
kind: Service
metadata:
  name: origin
spec:
  clusterIP: None
  selector:
    app: origin
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: origin
spec:
  serviceName: origin
  replicas: 1
  selector:
    matchLabels:
      app: origin
  template:
    metadata:
      labels:
        app: origin
        lab/role: origin
    spec:
      {{- if .Values.hostNetwork.enabled }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.affinity.enabled }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: lab/role
                    operator: In
                    values: [pgcache, loadgen]
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.image.origin.repository }}:{{ .Values.image.origin.tag }}"
          imagePullPolicy: {{ .Values.image.origin.pullPolicy }}
          args:
            - postgres
            - -c
            - wal_level=logical
            - -c
            - max_wal_senders=10
            - -c
            - max_replication_slots=10
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - pg_stat_statements.track=all
            - -c
            - shared_buffers={{ .Values.origin.sharedBuffers }}
            - -c
            - max_connections={{ .Values.origin.maxConnections }}
            - -c
            - work_mem={{ .Values.origin.workMem }}
            - -c
            - maintenance_work_mem={{ .Values.origin.maintenanceWorkMem }}
            - -c
            - random_page_cost={{ .Values.origin.randomPageCost }}
            - -c
            - track_io_timing=on
          env:
            - name: POSTGRES_USER
              value: {{ .Values.origin.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.origin.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            {{- toYaml .Values.origin.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.origin.user }}
                - -d
                - {{ .Values.origin.database }}
            periodSeconds: 5
            failureThreshold: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.origin.storage.storageClassName }}
        storageClassName: {{ .Values.origin.storage.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.origin.storage.size }}
