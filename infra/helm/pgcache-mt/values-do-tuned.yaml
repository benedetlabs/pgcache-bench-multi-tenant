# Tuned profile for DigitalOcean Kubernetes (DOKS) benchmark.
# Sized for 3 nodes of s-4vcpu-8gb ($0.071/hr each = ~$0.21/hr total).
# Optimizations:
# 1. Privileged netTune initContainer:
#    - net.ipv4.tcp_slow_start_after_idle=0
#    - net.core.somaxconn=65535
#    - net.ipv4.tcp_max_syn_backlog=65535
#    - net.ipv4.tcp_tw_reuse=1
#    - VirtIO RPS enabled across all vCPUs (rps_cpus = f)
# 2. PgCache sizing:
#    - NUM_WORKERS = 8
#    - PGCACHE_POPULATION_WORKERS_MIN = 4
#    - MEMO_CACHE_SIZE = "1073741824" (1 GiB raw integer bytes)
#    - MEMORY_LIMIT = "3758096384" (3.5 GiB raw integer bytes)
# 3. Direct node IP routing & hostNetwork: true

affinity:
  # Enforces 3 separate physical nodes across origin, pgcache, and loadgen
  enabled: true

hostNetwork:
  # Direct node IP bypasses overlay network latency
  enabled: true

netTune:
  enabled: true
  image: "busybox:1.36"

image:
  origin:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  pgcache:
    repository: pgcache/pgcache
    tag: "0.7.1"
    pullPolicy: IfNotPresent
  loadgen:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  metricsReader:
    repository: alpine
    tag: "3.20"
    pullPolicy: IfNotPresent

origin:
  database: bench
  user: bench
  password: benchpass
  sharedBuffers: "512MB"
  maxConnections: 500
  workMem: "16MB"
  maintenanceWorkMem: "256MB"
  randomPageCost: "1.1"
  resources:
    requests:
      cpu: "2500m"
      memory: "5Gi"
  storage:
    size: 80Gi
    storageClassName: "do-block-storage"

pgcache:
  allowedTables:
    - product
    - category
    - seller
    - customer
    - orders
    - order_item
    - review
  telemetry: "off"
  workers: 8
  populationWorkersMin: 4
  memoCacheSize: "1073741824"
  memoryLimit: "3758096384"
  listenPort: 6432
  metricsPort: 9091
  resources:
    requests:
      cpu: "2500m"
      memory: "5Gi"

loadgen:
  resources:
    requests:
      cpu: "2500m"
      memory: "2Gi"
  storage:
    size: 15Gi
    storageClassName: "do-block-storage"

metricsReader:
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
