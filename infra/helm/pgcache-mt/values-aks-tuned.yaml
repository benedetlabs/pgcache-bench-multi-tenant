# Tuned & Quota-Flexible Azure Kubernetes Service (AKS) Spot profile for pgcache-mt.
# Preserves identical PostgreSQL 17 and PgCache 0.7.1 engine flags (shared_buffers=1GB,
# work_mem=32MB, NUM_WORKERS=8, PGCACHE_POPULATION_WORKERS_MIN=4, MEMO_CACHE_SIZE=1GiB,
# hostNetwork: true, netTune TCP sysctls + RPS, and 1-pod-per-node podAntiAffinity),
# while setting scheduler requests (cpu: 2500m, no CPU limits) so pods schedule cleanly
# on BOTH 8-vCPU (Standard_D8as_v5) AND 4-vCPU (Standard_E4s_v5 / Standard_D4as_v5) Spot pools.

affinity:
  # Enforces 3 separate physical Spot nodes across origin, pgcache, and loadgen
  enabled: true

hostNetwork:
  # Direct node IP bypasses kube-proxy, NAT, and Azure CNI Overlay overhead
  enabled: true

netTune:
  enabled: true
  image: "busybox:1.36"

# Pin benchmark pods (origin, pgcache, loadgen) strictly to the 3-node Spot user pool
nodeSelector:
  kubernetes.azure.com/scalesetpriority: spot

tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"

image:
  origin:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  pgcache:
    repository: pgcache/pgcache
    tag: "0.7.1"
    pullPolicy: IfNotPresent
  loadgen:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  metricsReader:
    repository: alpine
    tag: "3.20"
    pullPolicy: IfNotPresent

origin:
  database: bench
  user: bench
  password: benchpass
  sharedBuffers: "1GB"
  maxConnections: 500
  workMem: "32MB"
  maintenanceWorkMem: "512MB"
  randomPageCost: "1.1"
  resources:
    requests:
      cpu: "2500m"
      memory: "8Gi"
  storage:
    size: 32Gi
    storageClassName: "managed-csi"

pgcache:
  allowedTables:
    - product
    - category
    - seller
    - customer
    - orders
    - order_item
    - review
  telemetry: "off"
  workers: 8
  populationWorkersMin: 4
  memoCacheSize: "1073741824"
  memoryLimit: "10737418240"
  listenPort: 6432
  metricsPort: 9090
  resources:
    requests:
      cpu: "2500m"
      memory: "8Gi"

loadgen:
  resources:
    requests:
      cpu: "2500m"
      memory: "4Gi"
  storage:
    size: 16Gi
    storageClassName: "managed-csi"

# Pin metrics-reader onto the 1-node system pool (README.md Section 7.1)
metricsReader:
  nodeSelector:
    kubernetes.azure.com/mode: system
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
